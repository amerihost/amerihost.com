kind = "web"
previewPath = "/"
title = "AmeriHost"
description = "A static-site foundation for the AmeriHost rebuild, prepared for Cloudflare Pages and future Decap CMS content."
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22333

[services.development]
run = "pnpm --filter @workspace/web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web", "run", "build" ]
serve = "static"
publicDir = "artifacts/web/dist/public"

[services.env]
PORT = "22333"
BASE_PATH = "/"
